appId: net.bigtreeviewer.desktop
productName: Big Tree Viewer
asar: true
directories:
  output: release
publish:
  provider: github
  owner: John-Allard
  repo: big_tree_viewer
toolsets:
  appimage: "1.0.3"
files:
  - dist/**/*
  - "!dist/example_tree.btvsession"
  - desktop/**/*
  - package.json
extraResources:
  - from: desktop/app-update.yml
    to: app-update.yml
  - from: desktop/bigtreeviewer-mcp
    to: bin/bigtreeviewer-mcp
fileAssociations:
  - ext:
      - btvsession
    name: Big Tree Viewer session
    description: Big Tree Viewer session
    role: Viewer
  - ext:
      - nwk
      - newick
      - tre
      - tree
      - treefile
      - trees
      - nexus
      - nex
      - nh
      - nhx
      - dnd
      - contree
      - mcc
      - mctree
      - ufboot
    name: Phylogenetic tree
    description: Phylogenetic tree
    role: Viewer
mac:
  category: public.app-category.education
  icon: public/icon-512.png
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: Big-Tree-Viewer-macOS-universal.${ext}
win:
  icon: public/icon-512.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Big-Tree-Viewer-Windows-x64.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  packElevateHelper: false
linux:
  category: Science
  icon: public/icon-512.png
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Big-Tree-Viewer-Linux-x86_64.${ext}
